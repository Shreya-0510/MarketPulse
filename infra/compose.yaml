name: marketpulse

services:
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:29092:29092"   # host access only; containers use kafka:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: {condition: service_healthy}
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    # Topic names/partitions mirror config/settings.yaml (kafka.topics). create --if-not-exists is non-destructive.
    command:
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh; B=kafka:9092; R=604800000
        for t in market.raw social.raw news.raw; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1 --config retention.ms=$$R
        done
        for t in analytics.entity analytics.attention analytics.anomalies system.pipeline; do
          $$K --bootstrap-server $$B --create --if-not-exists --topic $$t --partitions 1 --replication-factor 1 --config retention.ms=$$R
        done
        $$K --bootstrap-server $$B --list

  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  mongo-init:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile}
    image: marketpulse-api:dev
    depends_on:
      mongodb: {condition: service_healthy}
    restart: "no"
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      SOCIAL_RETENTION_DAYS: ${SOCIAL_RETENTION_DAYS:-14}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-30}
    command: ["python", "-m", "marketpulse_common.mongo_schema"]

  api:
    image: marketpulse-api:dev
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      STALE_AFTER_DAYS: ${STALE_AFTER_DAYS:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  ingestion-market:
    build: {context: .., dockerfile: infra/docker/ingestion.Dockerfile}
    image: marketpulse-ingestion:dev
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  spark-streaming:
    build: {context: .., dockerfile: infra/docker/streaming.Dockerfile}
    image: marketpulse-streaming:dev
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      CHECKPOINT_ROOT: /checkpoints
      SPARK_TRIGGER_SECONDS: ${SPARK_TRIGGER_SECONDS:-10}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - spark_checkpoints:/checkpoints
    stop_grace_period: 30s

  ingestion-social:
    build: {context: .., dockerfile: infra/docker/ingestion.Dockerfile}
    image: marketpulse-ingestion:dev
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    command: ["python", "-m", "mp_ingestion.run_social"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  ingestion-news:
    build: {context: .., dockerfile: infra/docker/ingestion.Dockerfile}
    image: marketpulse-ingestion:dev
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    command: ["python", "-m", "mp_ingestion.run_news"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

  spark-text:
    build: {context: .., dockerfile: infra/docker/streaming.Dockerfile}
    image: marketpulse-streaming:dev
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    command: ["python", "-m", "mp_streaming.text_jobs"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      CHECKPOINT_ROOT: /checkpoints
      SPARK_TRIGGER_SECONDS: ${SPARK_TRIGGER_SECONDS:-10}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-1g}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - spark_checkpoints:/checkpoints
    stop_grace_period: 30s

  analytics-job:
    build: {context: .., dockerfile: infra/docker/streaming.Dockerfile}
    image: marketpulse-streaming:dev
    depends_on:
      mongo-init: {condition: service_completed_successfully}
    restart: unless-stopped
    command: ["python", "-m", "mp_streaming.analytics_job"]
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017}
      MONGO_DB: ${MONGO_DB:-marketpulse}
      MARKETPULSE_CONFIG_DIR: /app/config
      ANALYTICS_INTERVAL_SECONDS: ${ANALYTICS_INTERVAL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    stop_grace_period: 15s

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    image: marketpulse-web:dev
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"   # nginx serves the SPA and proxies /api (incl. WebSocket) to api:8000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]   # proves nginx -> api proxy works
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  kafka_data:
  mongo_data:
  spark_checkpoints:
